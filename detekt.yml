# Detekt configuration for KashCal
#
# Thresholds tuned for Android/Compose codebase.
# Existing violations captured in detekt-baseline.xml — only NEW issues fail the build.
#
# Run: ./gradlew detektDebug
# Baseline: ./gradlew detektBaseline

build:
  maxIssues: 0

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 10
    ignoreOverridden: true
    ignorePrivate: true
  LargeClass:
    active: true
    threshold: 600
  NestedBlockDepth:
    active: true
    threshold: 5
  NestedScopeFunctions:
    active: true
    threshold: 3

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  InjectDispatcher:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    # Composable functions use PascalCase; test names use backticks
    excludes:
      - '**/ui/**'
      - '**/widget/**'
      - '**/*Test*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  VariableNaming:
    active: true
    privateVariablePattern: '_?[a-z][A-Za-z0-9]*'

potential-bugs:
  active: true
  CastToNullableType:
    active: true
  DoubleMutabilityForCollection:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: false
  ImplicitDefaultLocale:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true

performance:
  active: true
  SpreadOperator:
    active: false # Common in Android (vararg intents, bundle args)
  CouldBeSequence:
    active: true
    threshold: 4
  UnnecessaryPartOfBinaryExpression:
    active: true

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
    excludePackageStatements: true
    excludeImportStatements: true
    excludeRawStrings: true
  WildcardImport:
    active: false # Common in Compose projects
  UnusedPrivateMember:
    active: true
    allowedNames: '_.*|ignored.*'
    ignoreAnnotated:
      - 'Preview'
  ReturnCount:
    active: true
    max: 5
    excludeGuardClauses: true
    excludeLabeled: true
    excludeReturnFromLambda: true
  ForbiddenComment:
    active: false
  UnnecessaryAbstractClass:
    active: true
  UnusedImports:
    active: true
  UseDataClass:
    active: true
    allowVars: true
  SerialVersionUIDInSerializableClass:
    active: false
  UtilityClassWithPublicConstructor:
    active: true
  OptionalAbstractKeyword:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|ignore.*'
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyIfBlock:
    active: true
  EmptyElseBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
    allowedExceptionNameRegex: '_|ignore.*'
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|ignore.*'
    exceptionNames:
      - 'Error'
      - 'NullPointerException'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'Throwable'
  NotImplementedDeclaration:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
