<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <rect width="1024" height="500" fill="#0e1116"/>

  <!-- Logo cards (new deck-of-cards mark, 88-unit space centered at 44,44),
       scaled to a ~320px area centered around (220, 250) -->
  <g transform="translate(60 90) scale(3.6363)">
    <g transform="translate(44 44) rotate(8)">
      <rect x="-18" y="-21" width="36" height="42" rx="6" fill="#f2c14e"/>
    </g>
    <g transform="translate(44 44) rotate(-7)">
      <rect x="-18" y="-21" width="36" height="42" rx="6" fill="#4a9bdc"/>
    </g>
    <g transform="translate(44 44) rotate(-2)">
      <rect x="-18" y="-21" width="36" height="42" rx="6" fill="#2a8a7a"/>
      <rect x="-18" y="-21" width="36" height="9" rx="6" fill="#0d9488"/>
      <rect x="-18" y="-16" width="36" height="5" fill="#2a8a7a"/>
      <text x="0" y="9" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fdf8ec">31</text>
      <circle cx="13" cy="-17" r="4" fill="#e85d75"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="440" y="240" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="92" font-weight="700" fill="#e6e8ec" letter-spacing="-2">KashCal</text>
  <text x="440" y="295" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="400" fill="#8c93a0">Private. No tracking. Open Source.</text>
</svg>
