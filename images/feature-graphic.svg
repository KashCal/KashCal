<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <rect width="1024" height="500" fill="#0e1116"/>

  <!-- Logo cards, scaled to fit a 320x320 area centered around (220, 250) -->
  <g transform="translate(60 90) scale(3.6363)">
    <g transform="translate(56 36) rotate(14)">
      <rect x="-12" y="-13" width="24" height="26" rx="4" fill="#f2c14e"/>
    </g>
    <g transform="translate(32 38) rotate(-12)">
      <rect x="-13" y="-15" width="26" height="30" rx="4.5" fill="#4a9bdc"/>
    </g>
    <g transform="translate(44 46) rotate(-2)">
      <rect x="-18" y="-20" width="36" height="40" rx="6" fill="#2a8a7a"/>
      <rect x="-18" y="-20" width="36" height="8" rx="6" fill="#0d9488"/>
      <text x="0" y="10" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fdf8ec">31</text>
      <circle cx="14" cy="-16" r="4" fill="#e85d75"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="440" y="240" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="92" font-weight="700" fill="#e6e8ec" letter-spacing="-2">KashCal</text>
  <text x="440" y="295" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="400" fill="#8c93a0">Private. No tracking. Open Source.</text>
</svg>
