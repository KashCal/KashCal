<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 88 88">
  <!-- Supporter variant of the deck: gold front card, blue + teal peeking
       behind, a red heart in place of the today-dot, and a dark numeral for
       contrast on gold. Same equal-size (36x42) deck fanned around (44,46)
       as the default icon. -->
  <g transform="translate(44 46) rotate(-7)">
    <rect x="-18" y="-21" width="36" height="42" rx="6" fill="#4a9bdc"/>
  </g>
  <g transform="translate(44 46) rotate(8)">
    <rect x="-18" y="-21" width="36" height="42" rx="6" fill="#2a8a7a"/>
  </g>
  <g transform="translate(44 46) rotate(-2)">
    <rect x="-18" y="-21" width="36" height="42" rx="6" fill="#f2b72d"/>
    <text x="0" y="9" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1c1c1e">31</text>
    <!-- Heart, centered near (13,-15), ~11 units wide. -->
    <path transform="translate(13 -14) scale(0.5)" fill="#d6304a"
      d="M 0,9 C -8,1 -11,-4 -11,-8 C -11,-12 -8,-14 -5,-14 C -2.5,-14 -0.8,-12.5 0,-11 C 0.8,-12.5 2.5,-14 5,-14 C 8,-14 11,-12 11,-8 C 11,-4 8,1 0,9 Z"/>
  </g>
</svg>
