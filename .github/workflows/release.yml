name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run builds the APK and uploads it as a run artifact without creating a
  # release. A tag push creates the release; re-push the tag to recreate one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    # Public repo only. The private repo attaches its own locally built APK, so a private
    # tag push skips this job. The public APK is built by CI from the public commit hash
    # so the build is reproducible. If the public repo is renamed, update this string, or
    # every public tag skips the job without an error.
    if: github.repository == 'KashCal/KashCal'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

    - name: Build signed release APK
      env:
        KEYSTORE_FILE: release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Get version from properties
      id: version
      run: |
        VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

    - name: Verify APK signature
      run: |
        # Newest build-tools on the runner image, so a removed version doesn't break this.
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify -v app/build/outputs/apk/release/app-release.apk

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/KashCal-${{ steps.version.outputs.version }}-release.apk

    - name: Extract release notes from CHANGELOG
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Slice the body under "## [<version>]" up to the next "## " heading
        # (or EOF), then trim leading/trailing blank lines.
        if [ -f CHANGELOG.md ]; then
          awk -v v="## [$VERSION]" '
            index($0, v) == 1       { f = 1; next }
            f && (/^## / || /^<!--/) { exit }
            f' CHANGELOG.md \
            | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > release_notes.md
        fi
        if [ -s release_notes.md ]; then
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "found=false" >> $GITHUB_OUTPUT
          echo "No CHANGELOG.md section for $VERSION; falling back to auto-generated notes."
        fi

    - name: Create release with APK attached
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        # Create the release and attach the APK in one call: immutable releases seal a
        # release created empty before the APK can be attached.
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body_path: ${{ steps.notes.outputs.found == 'true' && 'release_notes.md' || '' }}
        generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
        files: app/build/outputs/apk/release/KashCal-${{ steps.version.outputs.version }}-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK as Artifact (manual trigger)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: KashCal-${{ steps.version.outputs.version }}-release
        path: app/build/outputs/apk/release/KashCal-${{ steps.version.outputs.version }}-release.apk

    - name: Cleanup keystore
      if: always()
      run: rm -f app/release.keystore
