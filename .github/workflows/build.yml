name: Build

on:
  pull_request:
    branches: [ "main" ]

permissions: read-all

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # A pull request can replace gradle-wrapper.jar; this fails unless the jar matches a
    # published Gradle release.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest :icaldav-core:test :vcard-core:test --continue --no-daemon

    # Compares rendered UI against the committed goldens. Non-blocking: the goldens are
    # recorded on a Linux x86_64 host, and a runner image can render within or outside
    # the comparison threshold. cleanTestDebugUnitTest and --no-build-cache make the test
    # task run; a cached result would skip the comparison.
    - name: Verify screenshots (visual regression)
      id: screenshot_verify
      run: ./gradlew cleanTestDebugUnitTest testDebugUnitTest --tests "*Screenshot*" -Proborazzi.test.verify=true --no-build-cache --no-daemon
      continue-on-error: true

    - name: Upload screenshot diffs
      if: steps.screenshot_verify.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-diffs
        path: app/build/outputs/roborazzi/
        retention-days: 7

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          app/build/reports/tests/
          icaldav-core/build/reports/tests/
          vcard-core/build/reports/tests/

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
