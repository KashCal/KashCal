name: Build

on:
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon

    # Visual-regression gate: renders covered UI on the JVM (Robolectric native
    # graphics) and compares against committed goldens. Non-blocking for now
    # (continue-on-error) until the first runs confirm this ubuntu-latest runner
    # matches the goldens recorded on Linux x86_64 within the comparison
    # threshold; flip to blocking once that cross-host delta is confirmed.
    # cleanTestDebugUnitTest + --no-build-cache force the test task to actually
    # execute (compile stays up-to-date) — otherwise Gradle could restore a
    # cached result and the visual assertion would never run.
    - name: Verify screenshots (visual regression)
      id: screenshot_verify
      run: ./gradlew cleanTestDebugUnitTest testDebugUnitTest --tests "*Screenshot*" -Proborazzi.test.verify=true --no-build-cache --no-daemon
      continue-on-error: true

    - name: Upload screenshot diffs
      if: steps.screenshot_verify.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-diffs
        path: app/build/outputs/roborazzi/
        retention-days: 7

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
