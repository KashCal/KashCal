name: Docs, build or translation
description: A change to documentation, CI, the build or a translation
body:
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: The file, page or string, and what is wrong with it now.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What the change fixes or improves.
    validations:
      required: true
